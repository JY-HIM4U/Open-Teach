defaults:
  - _self_
  - network
  - robot: allegro
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  

# To run the robot
operate: true
sim_env: false
run_xela:  false

# Safety / validation: when true, the operator runs the full pipeline
# (streaming, state reading, retargeting, logging) but NEVER sends any
# command to the robot. Nothing moves. Used to validate the app end-to-end
# with zero motion risk. See docs/franka_validation.md.
dry_run: false

# Visualize 3D and 2D plots
visualize_xela: false
visualize_right_2d:  false
visualize_right_3d: false
visualize_right_dir: false

hydra:  
  output_subdir: null  
  run:  
    dir: .