defaults:
  - _self_
  - network
  - robot: allegro
  - override hydra/hydra_logging: disabled  
  - override hydra/job_logging: disabled  

# To run the robot
operate: true
sim_env: false
run_xela:  false

# Safety / validation: when true, the operator runs the full pipeline
# (streaming, state reading, retargeting, logging) but NEVER sends any
# command to the robot. Nothing moves. Used to validate the app end-to-end
# with zero motion risk. See docs/franka_validation.md.
dry_run: false

# Per-operator dry-run overrides (default: follow the global dry_run above).
# Lets you run ONE robot live while the other only logs. Example intermediate
# bring-up -- hand physically follows your fingers, arm just prints:
#   python teleop.py robot=inspire_franka arm_dry_run=True
hand_dry_run: ${dry_run}
arm_dry_run: ${dry_run}

# Tunables you can override on the CLI (e.g. thumb_rot_fixed=null workspace_box=0.5).
# Used by robot=inspire_franka.
thumb_rot_fixed: 500     # lock thumb rotation (0-1000); null = retarget it
workspace_box: 0.35      # half-size (m) of the arm safety clamp box (+/- per axis)

# Wrist-orientation following for the arm.
orient_follow: true      # true = EE follows your wrist rotation; false = old behaviour
orient_flip: null        # e.g. [1,1,-1] to invert a rotation axis during calibration

# Visualize 3D and 2D plots
visualize_xela: false
visualize_right_2d:  false
visualize_right_3d: false
visualize_right_dir: false

hydra:  
  output_subdir: null  
  run:  
    dir: .